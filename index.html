<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
        }

        /* Navbar */
        nav {
            background-color: #222;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            font-weight: bold;
        }

        nav a:hover {
            color: #00c6ff;
        }

        /* Section Title */
        h1 {
            text-align: center;
            margin: 30px 0;
            color: #333;
        }

        /* Gallery Layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px 40px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            transition: transform 0.4s, box-shadow 0.4s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0px 8px 15px rgba(0,0,0,0.3);
        }

        section {
            padding-bottom: 50px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <a href="#nature">Nature</a>
    <a href="#animals">Animals</a>
    <a href="#travel">Travel</a>
    <a href="#food">Food</a>
    <a href="#art">Art</a>
</nav>
